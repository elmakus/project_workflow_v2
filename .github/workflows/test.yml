name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: python3 -m pip install --disable-pip-version-check -r requirements-test.txt
      - name: Run repository checks
        run: sh scripts/test.sh
