origin_subject = "Ensure every canonical PWv2 durable-state producer emits state conforming to the same current executable schema used by the router/validators, and add deterministic fail-closed intra-V2 schema reconciliation for supported older or legacy-shaped active workstreams that preserves accepted scope, approvals and immutable authority, with fresh-materialization and resume regression coverage."
return_target = "intake"
return_reconciliation = "pending"
return_result = ""
finding = "Both supplied reproductions are producer/consumer drift under an already-current executable contract, not proven post-materialization contract-evolution events. The router/validators are centralized in tools/state_contract.py and tools/router.py, but ordinary durable-state production has no single machine-enforced writer/serializer path and can emit stale or guessed field names/enums/shapes. PWv2 also lacks a versioned intra-V2 schema migration dispatcher; current Recovery fails closed on invalid state but does not define deterministic authority-preserving migration."
limitations = "The two supplied reproductions do not establish a real historical V2 schema-version transition because their declared creation bases use the same relevant validator/router/workflow blobs as current main. A future supported older-V2 migration contract still needs explicit design and fixtures."
conflicts = "Issue #23 characterizes the second reproduction as contract evolution. Exact Git evidence conflicts with that characterization: relevant canonical contract blobs at its declared creation base are identical to current main. The missing intra-V2 migration mechanism remains a real architectural gap, but it is not what caused these two specific malformed writes."

