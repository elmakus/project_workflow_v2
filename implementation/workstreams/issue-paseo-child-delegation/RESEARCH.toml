finding = "PWv2 correctly requires semantic independence and runtime-neutral authority, but a receiving Paseo/Pi context can falsely classify delegation as unavailable when it tests only for an exposed native agent-scoped create_agent/MCP surface. Upstream Paseo v0.9.2 defines create_agent in its caller-scoped Paseo tool catalog and Pi receives that catalog through its MCP adapter path; project runtime evidence separately proves Paseo daemon -> Pi-provider child launch. The bounded repair is capability-based: permit an evidence-bound fallback child-launch/delegation path only when it can preserve exact subject, independent context, lifecycle/readback and fail-closed semantics. A mere spawned pi process is not by itself equivalent to create_agent."
limitations = "The current pi-unraid evidence proves daemon-parented Pi agent launch, not that the exact production Paseo session exposes create_agent inside Pi. The fallback therefore must verify its usable delegation surface and child/result binding at runtime rather than infer capability from process presence. No claim is made that CLI launch and native create_agent are identical implementations."
conflicts = "No authority conflict. Upstream supports both Pi process-backed agents and caller-scoped Paseo tools, while project evidence proves child launch but not in-agent tool exposure. The apparent conflict is resolved by distinguishing launch capability from agent-scoped delegation capability."

