# TEMPLATE ONLY — append a new file for every review attempt.
# New/current attempts use explicit review_kind fields and an exact Board
# locator (commit + blob). Legacy-shaped attempts (no review_kind) are valid
# only as the initial historical prefix with explicit [legacy_migration]
# provenance bound to the exact immutable source attempt and source
# Git/workstream state; shape alone never proves legacy status.
workstream_id = "example-workstream"
card_id = "M03-T01"
attempt = "R01"
verdict = "pending"
evidence_path = ""
# Legacy-only, terminal green/red prefix attempts only; omit on explicit attempts:
# [legacy_migration]
# source_repository = "owner/repository"
# source_commit = "<40-hex source commit>"
# source_path = "implementation/workstreams/example-workstream/reviews/M03-T01-R01.toml"
# source_blob = "<40-hex source blob>"
# source_workstream = "example-workstream"
# source_card = "M03-T01"
# source_attempt = "R01"
review_kind = "discovery"
source_discovery_attempt = ""
discovery_complete = false
material_finding_ids = []
review_scope = "card"
review_epoch = "E01"
epoch_reset_basis = ""
# On a changed epoch only, epoch_reset_basis must be non-empty and bind one exact
# accepted authority/acceptance redesign subject, for example:
# [epoch_reset_subject]
# class = "accepted_redesign"
# repository = "owner/repository"
# commit = "0000000000000000000000000000000000000000"
# path = "requirements/ACCEPTED_REQUIREMENTS.md"
# blob = "0000000000000000000000000000000000000000"
material_defect_class_ids = []
# RED closure_verification only: subset of material_defect_class_ids that actually remained blocking.
failed_material_defect_class_ids = []
post_convergence_validation = false
convergence_basis = ""

[subject]
class = "git_blob"
repository = "owner/repository"
commit = "0000000000000000000000000000000000000000"
path = "path/to/reviewed/artifact"
blob = "0000000000000000000000000000000000000000"

[acceptance]
class = "task_card"
path = "implementation/workstreams/example-workstream/cards/M03-T01.md"
# H005: Card Review binds the exact selected Task Card path plus exact
# acceptance content. Commit the Card file and record its real Git identity;
# path-only acceptance cannot prove exact content at the serving boundary.
commit = "0000000000000000000000000000000000000000"
blob = "0000000000000000000000000000000000000000"

[independence]
materially_produced_or_repaired_subject = false
basis = "Semantic independence evidence only; never runtime/model/session identity."
